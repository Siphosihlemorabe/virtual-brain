# Local development services. Start: docker compose up -d   Stop: docker compose down
# Development only: the password here is not a secret and must never be used anywhere else.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: vb
      POSTGRES_PASSWORD: vb
      POSTGRES_DB: vb
    ports:
      - "5434:5432"   # 5434 on this machine: local PostgreSQL installs already use 5432 and 5433
    volumes:
      - vb-pgdata:/var/lib/postgresql/data   # keeps data when the container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vb -d vb"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  vb-pgdata:
